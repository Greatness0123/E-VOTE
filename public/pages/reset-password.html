<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set New Password — SUG VOTE</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand-mark">SV</div>
    <div><div class="brand-name">SUG VOTE</div></div>
  </div>
  <div class="container">
    <div class="card">
      <h1>Set New Password</h1>
      <p class="muted">Minimum 10 characters, with upper, lower, a number, and a symbol.</p>
      <form id="reset-form">
        <label for="password">New Password</label>
        <input type="password" id="password" required />
        <div id="error" class="error-text"></div>
        <button type="submit" class="btn btn-primary btn-block">Update Password</button>
      </form>
      <div id="msg" class="muted" style="margin-top:14px;"></div>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/reset-password.js"></script>
</body>
</html>
