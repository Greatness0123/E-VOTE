<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — SUG VOTE</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand-mark">SV</div>
    <div><div class="brand-name">SUG VOTE</div></div>
  </div>
  <div class="container">
    <div class="card">
      <h1>Reset Password</h1>
      <p class="muted">Enter your matriculation number. If an account exists, we'll email a reset link.</p>
      <form id="forgot-form">
        <label for="matric">Matriculation Number</label>
        <input type="text" id="matric" required />
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>
      <div id="msg" class="muted" style="margin-top:14px;"></div>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/forgot-password.js"></script>
</body>
</html>
